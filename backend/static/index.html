<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AGV Warehouse Simulation</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>
<div class="app">

  <!-- HEADER -->
  <header class="header">
    <div class="title-section">
      <h1>Warehouse AGV Control System</h1>
      <p class="subtitle">ERP → WMS → AGV → Delivery Simulation</p>
    </div>

    <div class="controls">
      <div class="input-group">
        <label>WMS Location (Rack)</label>
        <input id="pickup" placeholder="Ex: 2,3">
      </div>

      <div class="input-group">
        <label>Delivery Point</label>
        <input id="delivery" placeholder="Ex: 8,6">
      </div>

      <button id="createOrder">Create Transport Order</button>
      <button id="resetBtn" class="secondary">Reset AGV</button>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main>

    <!-- GRID AREA -->
    <section class="left">
      <div class="warehouse-label">Warehouse Layout</div>
      <div id="grid" class="grid"></div>
      <div class="legend">
        <span class="legend-box agv-color"></span> AGV
        <span class="legend-box rack-color"></span> WMS Rack
        <span class="legend-box pickup-color"></span> Pickup Zone
        <span class="legend-box delivery-color"></span> Delivery Zone
      </div>
    </section>

    <!-- RIGHT PANEL -->
    <aside class="right">
      <h2>Active Orders</h2>
      <ul id="ordersList"></ul>

      <div class="status-panel">
        <h3>AGV Status</h3>
        <div id="statusBox" class="status-box">
          IDLE
        </div>
      </div>
    </aside>

  </main>

  <!-- FOOTER -->
  <footer>
    <small>
      AGV automatically moves to WMS rack, picks product, and delivers to destination.
    </small>
  </footer>

</div>

<script src="/static/main.js"></script>
</body>
</html>
